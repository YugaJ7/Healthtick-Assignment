<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android in the browser</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span id="status" data-state="connecting" role="status">Starting</span>
    <span id="stats"></span>
  </header>
  <form id="code-form" hidden>
    <label for="code-input">Access code</label>
    <input id="code-input" type="password" autocomplete="off" required>
    <button type="submit">Connect</button>
  </form>
  <main>
    <canvas id="screen" width="720" height="1280" tabindex="0" aria-label="Android device screen. Click to control it; type to send keys."></canvas>
  </main>
  <nav id="device-buttons" aria-label="Device buttons">
    <button type="button" data-key="Back">Back</button>
    <button type="button" data-key="Home">Home</button>
    <button type="button" data-key="AppSwitch">Recents</button>
    <button type="button" id="switch-mode">Switch to Clock only</button>
    <button type="button" id="end-session">End session</button>
  </nav>
  <div id="tools">
    <div class="tool">
      <button type="button" id="paste">Paste into device</button>
      <label for="device-clipboard">Copied on the device</label>
      <textarea id="device-clipboard" rows="1" readonly></textarea>
      <button type="button" id="copy-device">Copy</button>
    </div>
    <p id="clipboard-note" role="status"></p>
    <details>
      <summary>Recordings of your sessions</summary>
      <p>Every session is recorded on the server. Only this browser can open its recordings; they are deleted after 24 hours.</p>
      <ul id="recording-list"></ul>
    </details>
    <details>
      <summary>Latency test</summary>
      <button type="button" id="latency-run">Run 40 taps</button>
      <pre id="latency-result" role="status"></pre>
    </details>
  </div>
  <section id="ended" hidden>
    <p id="ended-reason"></p>
    <video id="recording" controls hidden></video>
    <a id="recording-download" hidden>Download the recording of this session</a>
    <button type="button" id="new-session">Start a new session</button>
  </section>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
